<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Discover Nigeria's most popular tourist destinations.">

    <meta name="author" content="John Chukwu">

    <title>Explore Nigeria | Destinations</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/project.css">

    <link rel="stylesheet" href="styles/project-large.css">

</head>

<body>

    <header>

        <div class="header-container">

            <div class="logo">
                🌍 Explore Nigeria
            </div>

            <button id="menu" aria-label="Open navigation menu" aria-expanded="false"
                aria-controls="primary-navigation">
                ☰
            </button>

            <nav aria-label="Primary Navigation">

                <ul class="navigation" id="primary-navigation">

                    <li>
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="destinations.html" class="active" aria-current="page">
                            Destinations
                        </a>
                    </li>

                    <li>
                        <a href="plan.html">
                            Travel Planner
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>

    <main>

        <section>

            <h1>Explore Destinations</h1>

            <p>
                Browse some of Nigeria's most exciting attractions and experiences.
                Use the filter below to explore by category.
            </p>

        </section>

        <section>

            <h2>Filter Destinations</h2>

            <label for="category">
                Choose a category:
            </label>

            <select id="category">

                <option value="All">All</option>

                <option value="Nature">Nature</option>

                <option value="History">History</option>

                <option value="Adventure">Adventure</option>

                <option value="Wildlife">Wildlife</option>

                <option value="Cuisine">Cuisine</option>

            </select>

        </section>

        <section>

            <h2>Available Destinations</h2>

            <div id="destination-list" class="card-container">

            </div>

        </section>

    </main>

    <footer>

        <p>
            © 2026 | John Chukwu | WDD 131
        </p>

        <p>
            <a href="references.html">
                References
            </a>
        </p>

    </footer>

    <script src="scripts/data.js"></script>
    <script src="scripts/project.js"></script>

</body>

</html>
