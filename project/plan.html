<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Plan your trip to Nigeria using the Explore Nigeria travel planner.">

    <meta name="author" content="John Chukwu">

    <title>Explore Nigeria | Travel Planner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/project.css">

    <link rel="stylesheet" href="styles/project-large.css">

</head>

<body>

    <header>

        <div class="header-container">

            <div class="logo">
                🌍 Explore Nigeria
            </div>

            <button id="menu" aria-label="Open navigation menu" aria-expanded="false"
                aria-controls="primary-navigation">
                ☰
            </button>

            <nav aria-label="Primary Navigation">

                <ul class="navigation" id="primary-navigation">

                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="destinations.html">
                            Destinations
                        </a>
                    </li>

                    <li>
                        <a href="plan.html" class="active" aria-current="page">
                            Travel Planner
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>

    <main>

        <section>

            <h1>Travel Planner</h1>

            <p>
                Complete the form below to start planning your Nigerian adventure.
            </p>

        </section>

        <section>

            <h2>Plan Your Trip</h2>

            <form id="travel-form">

                <div class="form-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input type="text" id="fullname" name="fullname" required>

                </div>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email" id="email" name="email" required>

                </div>

                <div class="form-group">

                    <label for="destination">
                        Preferred Destination
                    </label>

                    <select id="destination" name="destination">

                        <option>Zuma Rock</option>

                        <option>Olumo Rock</option>

                        <option>Obudu Mountain Resort</option>

                        <option>Lekki Conservation Centre</option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="month">
                        Travel Month
                    </label>

                    <input type="month" id="month" name="month" required>

                </div>

                <div class="form-group">

                    <label for="comments">
                        Additional Notes
                    </label>

                    <textarea id="comments" name="comments" rows="5"></textarea>

                </div>

                <button type="submit" class="button">
                    Submit Plan
                </button>

            </form>

        </section>

        <section id="favorite">

            <h2>Favorite Destination</h2>

        </section>

        <section id="trip-summary">

            <h2>Trip Summary</h2>

        </section>

    </main>

    <footer>

        <p>
            © 2026 | John Chukwu | WDD 131
        </p>

        <p>

            <a href="references.html">
                References
            </a>

        </p>

    </footer>

    <script src="scripts/data.js"></script>

    <script src="scripts/project.js"></script>

</body>

</html>
