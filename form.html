<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form | WDD 131</title>

    <meta name="description"
        content="Submit a product review using this responsive product review form for the WDD 131 assignment.">

    <meta name="author" content="John Chukwu">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>

</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>

        <form method="get" action="review.html">

            <!-- Product Name -->

            <div class="form-group">

                <label for="product">Product Name <span>*</span></label>

                <select id="product" name="product" required>

                    <option value="" selected disabled>Select a Product ...</option>

                </select>

            </div>

            <!-- Rating -->

            <fieldset class="form-group">

                <legend>Overall Rating <span>*</span></legend>

                <div class="rating">

                    <label for="star1">
                        <input type="radio" id="star1" name="rating" value="1" required>
                        ☆
                    </label>

                    <label for="star2">
                        <input type="radio" id="star2" name="rating" value="2" required>
                        ☆☆
                    </label>

                    <label for="star3">
                        <input type="radio" id="star3" name="rating" value="3" required>
                        ☆☆☆
                    </label>

                    <label for="star4">
                        <input type="radio" id="star4" name="rating" value="4" required>
                        ☆☆☆☆
                    </label>

                    <label for="star5">
                        <input type="radio" id="star5" name="rating" value="5" required>
                        ☆☆☆☆☆
                    </label>

                </div>

            </fieldset>

            <!-- Installation Date -->

            <div class="form-group">

                <label for="installDate">
                    Date of Installation <span>*</span>
                </label>

                <input type="date" id="installDate" name="installDate" required>

            </div>

            <!-- Useful Features -->

            <fieldset class="form-group">

                <legend>Useful Features (Check all that apply)</legend>

                <div class="checkbox-group">

                    <input type="checkbox" id="durability" name="features" value="Durability">

                    <label for="durability">
                        Durability
                    </label>

                    <input type="checkbox" id="ease" name="features" value="Ease of Use">

                    <label for="ease">
                        Ease of Use
                    </label>

                    <input type="checkbox" id="performance" name="features" value="Performance">

                    <label for="performance">
                        Performance
                    </label>

                    <input type="checkbox" id="design" name="features" value="Design">

                    <label for="design">
                        Design
                    </label>

                </div>

            </fieldset>

            <!-- Written Review -->

            <div class="form-group">

                <label for="review">

                    Written Review (Optional)

                </label>

                <textarea id="review" name="review" rows="6"></textarea>

            </div>

            <!-- User Name -->

            <div class="form-group">

                <label for="username">

                    Your Name (Optional)

                </label>

                <input type="text" id="username" name="username">

            </div>

            <input type="submit" value="Post Review" class="submit-btn">

        </form>

    </main>

    <footer>

        <p>

            &copy;
            <span id="currentyear"></span>

            🌸 John Chukwu 🌸 Nigeria

        </p>

        <p>

            Last Modified:
            <span id="lastModified"></span>

        </p>

    </footer>

</body>

</html>
